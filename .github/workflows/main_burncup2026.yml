# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy container app to Azure Web App - BURNCUP2026

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to container registry
        uses: docker/login-action@v2
        with:
          registry: burncup2026registry.azurecr.io/
          username: ${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME_E3AE60D9E7C349D5B5C98A9EC075B79E }}
          password: ${{ secrets.AZUREAPPSERVICE_CONTAINERPASSWORD_5A7AAD8C176146A3AA9C6025987C8798 }}

      - name: Build and push container image to registry
        uses: docker/build-push-action@v3
        with:
          context: .
          push: true
          tags: burncup2026registry.azurecr.io/${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME_E3AE60D9E7C349D5B5C98A9EC075B79E }}/go-backend:${{ github.sha }}
          file: ./Dockerfile

  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    needs: build
    
    steps:
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_9F8387BC9E9A4E06973D16BEDD2ACE86 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_0BACD6312FC94B938ECE44C570BFC93F }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_11F922056DD3409C90A9A817634911C5 }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v2
        with:
          app-name: 'BURNCUP2026'
          slot-name: 'Production'
          images: 'burncup2026registry.azurecr.io/${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME_E3AE60D9E7C349D5B5C98A9EC075B79E }}/go-backend:${{ github.sha }}'
          